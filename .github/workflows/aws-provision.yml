name: Provision Invoro AWS Demo

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      confirmation:
        description: Type APPLY when action is apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: invoro-aws-demo
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_frontend_host: ${{ vars.INVORO_FRONTEND_HOST }}
      TF_VAR_api_host: ${{ vars.INVORO_API_HOST }}
      TF_VAR_default_admin_email: ${{ vars.DEFAULT_ADMIN_EMAIL }}
      TF_VAR_demo_expiry_date: ${{ vars.DEMO_EXPIRY_DATE }}
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require apply confirmation
        if: inputs.action == 'apply'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'APPLY'

      - name: Validate demo expiry window
        env:
          DEMO_EXPIRY_DATE: ${{ vars.DEMO_EXPIRY_DATE }}
        run: |
          if [[ ! "$DEMO_EXPIRY_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "DEMO_EXPIRY_DATE must use YYYY-MM-DD." >&2
            exit 1
          fi
          if ! expiry_epoch=$(date -u -d "$DEMO_EXPIRY_DATE" +%s); then
            echo "DEMO_EXPIRY_DATE must be a valid calendar date." >&2
            exit 1
          fi
          if [[ "$(date -u -d "@$expiry_epoch" +%F)" != "$DEMO_EXPIRY_DATE" ]]; then
            echo "DEMO_EXPIRY_DATE must be a valid calendar date." >&2
            exit 1
          fi
          today_epoch=$(date -u -d "$(date -u +%F)" +%s)
          latest_epoch=$((today_epoch + 6 * 86400))
          if (( expiry_epoch < today_epoch || expiry_epoch > latest_epoch )); then
            echo "DEMO_EXPIRY_DATE must be today or within the next six days." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$TF_VAR_aws_account_id"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.0

      - name: Initialize remote state
        run: >-
          terraform init
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=invoro/demo/terraform.tfstate"
          -backend-config="region=$TF_VAR_aws_region"
          -backend-config="use_lockfile=true"

      - name: Validate
        run: terraform fmt -check -recursive && terraform validate

      - name: Plan
        run: terraform plan -out=invoro-demo.tfplan

      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve invoro-demo.tfplan

      - name: Publish outputs
        if: inputs.action == 'apply'
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"
