name: Destroy Invoro AWS Demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: invoro-aws-demo
  cancel-in-progress: false

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_frontend_host: ${{ vars.INVORO_FRONTEND_HOST }}
      TF_VAR_api_host: ${{ vars.INVORO_API_HOST }}
      TF_VAR_default_admin_email: ${{ vars.DEFAULT_ADMIN_EMAIL }}
      TF_VAR_demo_expiry_date: ${{ vars.DEMO_EXPIRY_DATE }}
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Require destroy confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'DESTROY'

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$TF_VAR_aws_account_id"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.0

      - name: Initialize remote state
        run: >-
          terraform init
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=invoro/demo/terraform.tfstate"
          -backend-config="region=$TF_VAR_aws_region"
          -backend-config="use_lockfile=true"

      - name: Destroy plan
        run: terraform plan -destroy -out=invoro-demo-destroy.tfplan

      - name: Destroy
        run: terraform apply -auto-approve invoro-demo-destroy.tfplan
