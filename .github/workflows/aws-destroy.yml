name: Destroy Invoro AWS Demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: invoro-aws-demo
  cancel-in-progress: false

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_frontend_host: ${{ vars.INVORO_FRONTEND_HOST }}
      TF_VAR_api_host: ${{ vars.INVORO_API_HOST }}
      TF_VAR_default_admin_email: ${{ vars.DEFAULT_ADMIN_EMAIL }}
      TF_VAR_demo_expiry_date: ${{ vars.DEMO_EXPIRY_DATE }}
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require destroy confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'DESTROY'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$TF_VAR_aws_account_id"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.0

      - name: Initialize remote state
        run: >-
          terraform init
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=invoro/demo/terraform.tfstate"
          -backend-config="region=$TF_VAR_aws_region"
          -backend-config="use_lockfile=true"

      - name: Destroy plan
        run: terraform plan -destroy -out=invoro-demo-destroy.tfplan

      - name: Destroy
        run: terraform apply -auto-approve invoro-demo-destroy.tfplan
