name: invoro

services:
  # NOTE: DB credentials default to dev values. Production/staging must supply
  # secure overrides via environment, .env, or docker-compose.override.yml / CI secrets.
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  db-rename:
    image: postgres:15-alpine
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-invoro}
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        database_exists() {
          psql --dbname postgres --list --tuples-only \
            | cut -d '|' -f 1 \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$$//' \
            | grep -Fqx -- "$$1"
        }
        reconcile_legacy_baseline() {
          version_table=$$(psql --dbname "$$POSTGRES_DB" --tuples-only --no-align --command \
            "SELECT to_regclass('public.alembic_version')")
          if [ -z "$$version_table" ]; then
            return
          fi
          revision=$$(psql --dbname "$$POSTGRES_DB" --tuples-only --no-align --command \
            'SELECT version_num FROM alembic_version')
          case "$$revision" in
            20260822_0001) ;;
            20260822_0010)
              psql --dbname "$$POSTGRES_DB" --set ON_ERROR_STOP=1 --command \
                "TRUNCATE alembic_version; INSERT INTO alembic_version (version_num) VALUES ('20260822_0001')"
              ;;
            *)
              echo >&2 "Database $$POSTGRES_DB has unsupported Alembic revision '$$revision'. Upgrade it to legacy head 20260822_0010 before starting this release."
              exit 1
              ;;
          esac
        }
        if ! database_exists "$$POSTGRES_DB"; then
          if [ "$$POSTGRES_DB" = "invoro" ] && database_exists "crawlerai"; then
            psql --dbname postgres --set ON_ERROR_STOP=1 --command \
              'ALTER DATABASE crawlerai WITH ALLOW_CONNECTIONS false'
            psql --dbname postgres --set ON_ERROR_STOP=1 --command \
              "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'crawlerai' AND pid <> pg_backend_pid()"
            if ! psql --dbname postgres --set ON_ERROR_STOP=1 --command \
              'ALTER DATABASE crawlerai RENAME TO invoro'; then
              psql --dbname postgres --command \
                'ALTER DATABASE crawlerai WITH ALLOW_CONNECTIONS true' || true
              echo >&2 "Could not rename crawlerai to invoro. Stop clients using crawlerai, then retry db-rename."
              exit 1
            fi
            psql --dbname postgres --set ON_ERROR_STOP=1 --command \
              'ALTER DATABASE invoro WITH ALLOW_CONNECTIONS true'
          else
            createdb --maintenance-db postgres "$$POSTGRES_DB"
          fi
        fi
        # The canonical baseline matches the fully migrated legacy schema. Preserve
        # all schema/data and replace only the obsolete legacy-head marker.
        reconcile_legacy_baseline
        database_exists "$$POSTGRES_DB"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: invoro-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment: &backend_env
      APP_ENV: development
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-invoro}
      REDIS_URL: redis://redis:6379/0
      REDIS_STATE_ENABLED: "false"
      CELERY_DISPATCH_ENABLED: "true"
      SCHEDULER_DRIVER: "celery"
      PLAYWRIGHT_HEADLESS: "true"
      FRONTEND_URL: http://127.0.0.1:4000
      FRONTEND_ORIGINS: http://127.0.0.1:4000,http://localhost:4000
      CRAWLER_RUNTIME_BROWSER_REAL_CHROME_ENABLED: "false"
    depends_on:
      db-rename:
        condition: service_completed_successfully
    command: ["python", "init_db.py"]

  api:
    image: invoro-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"
    volumes:
      - backend_artifacts:/app/backend/artifacts
      - backend_cookie_store:/app/backend/cookie_store
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:9000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: invoro-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    volumes:
      - backend_artifacts:/app/backend/artifacts
      - backend_cookie_store:/app/backend/cookie_store

  beat:
    image: invoro-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    volumes:
      - backend_artifacts:/app/backend/artifacts
      - backend_cookie_store:/app/backend/cookie_store

  frontend:
    image: invoro-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:9000}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "4000"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pg_data:
  redis_data:
  backend_artifacts:
  backend_cookie_store:
